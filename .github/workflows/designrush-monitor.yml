name: Monitor DesignRush updates

on:
  schedule:
    # 12:00 Asia/Shanghai (UTC+8)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: designrush-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for new editorial pages
        run: npm run monitor:designrush
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          MAX_AUTO_ARTICLES: '2'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
      - run: npm run build
      - name: Commit monitor results
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "designsworklife-bot"
          git config user.email "designsworklife-bot@users.noreply.github.com"
          git add data/designrush-monitor-state.json reports/designrush-updates src/content/automatedArticles.ts
          git commit -m "chore: update DesignRush editorial monitor"
          git push
